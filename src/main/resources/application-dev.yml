# DEV profile - local development
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=crown_care}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Naresh@6765}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
